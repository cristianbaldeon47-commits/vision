<!-- NAVEGACION: Barra fija con efecto vidrio -->
<nav class="fixed top-0 left-0 right-0 z-50
            bg-black/90 backdrop-blur-md
            border-b border-white/10
            px-8 py-3.5
            flex items-center justify-between
            text-white">

  <!-- Logo -->
  <div class="flex items-center gap-2">
    <span class="text-2xl font-black text-white leading-none">◎</span>
    <span class="text-sm font-bold tracking-wide">Visionary</span>
    <span class="ml-1 text-[10px] font-semibold uppercase tracking-widest
                 border border-white/20 text-white/50
                 px-2 py-0.5 rounded-full">Lookbook</span>
  </div>

  <!-- Menú central iterado con @for -->
  <ul class="flex items-center gap-1 list-none m-0 p-0">
    @for (item of enlaces(); track item.label) {
      <li>
        <a href="#"
           class="text-xs font-medium px-4 py-1.5 rounded-full transition-colors duration-200"
           [class]="item.activo
             ? 'bg-white text-black'
             : 'text-white/70 hover:text-white hover:bg-white/10'">
          {{ item.label }}
        </a>
      </li>
    }
  </ul>

  <!-- Botón CTA rojo -->
  <button class="text-xs font-semibold text-white
                 bg-red-600 hover:bg-red-700
                 px-5 py-2 rounded-full
                 transition-colors duration-200 cursor-pointer border-0">
    Ingresar
  </button>

</nav>
